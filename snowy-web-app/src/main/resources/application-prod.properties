#########################################
# prod - production environment configuration
#########################################
# datasource configuration
spring.datasource.dynamic.datasource.master.url=jdbc:mysql://localhost:3306/fp_mysql?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true&rewriteBatchedStatements=true
spring.datasource.dynamic.datasource.master.username=root
spring.datasource.dynamic.datasource.master.password=rootpassword

# close SQL logging
mybatis-plus.configuration.log-impl=

# fscloud 上传路径（相对于 jar 启动目录）
# fscloud.upload.static-path=../frontend/dist/static
# fscloud 上传路径可以写成绝对路径了，这是windows server 2012 R2 服务器的 samba 共享路径，在 linux 上挂载到 /mnt/win_share 目录下
fscloud.upload.static-path=/mnt/win_share/static
# fscloud 仿真路径，这是windows server 2012 R2 服务器的 samba 共享路径 (fs仿真程序运行在Windows Server上)
fscloud.sim.static-path=C:/LinuxShare/static
# fscloud - prod: use server 10.32.0.23
fscloud.mcp.endpoint-url=http://10.32.0.23:8081/mcp
fscloud.mqtt.broker-url=tcp://10.32.0.23:1883
